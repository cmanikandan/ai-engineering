<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0d1117" rx="8" />

  <rect x="20" y="20" width="160" height="200" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
  <text x="35" y="48" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">1. User Query</text>
  <rect x="30" y="60" width="140" height="55" rx="4" fill="#21262d" />
  <text x="38" y="80" fill="#f0f6fc" font-family="sans-serif" font-size="10">"What is Nvidia's</text>
  <text x="38" y="98" fill="#f0f6fc" font-family="sans-serif" font-size="10">stock price today?"</text>
  <text x="35" y="145" fill="#c9d1d9" font-family="sans-serif" font-size="10">Dispatches to model</text>

  <path d="M 180 85 L 220 85" stroke="#388bfd" stroke-width="2" />

  <rect x="225" y="20" width="185" height="200" rx="8" fill="#1b2a4a" stroke="#388bfd" stroke-width="1.5" />
  <text x="235" y="48" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">2. Gemini 2.5 Flash</text>
  <text x="235" y="70" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Inspects tool schema</text>
  <text x="235" y="90" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Decides tool is needed</text>
  <rect x="235" y="105" width="165" height="50" rx="4" fill="#21262d" />
  <text x="242" y="125" fill="#d29922" font-family="sans-serif" font-size="10">Returns Tool Call:</text>
  <text x="242" y="142" fill="#d29922" font-family="sans-serif" font-size="9">get_stock(ticker="NVDA")</text>
  <text x="235" y="185" fill="#3fb950" font-family="sans-serif" font-size="10">Pause Model Execution</text>

  <path d="M 410 130 L 445 130" stroke="#d29922" stroke-width="2" />

  <rect x="450" y="20" width="165" height="200" rx="8" fill="#382915" stroke="#d29922" stroke-width="1.5" />
  <text x="460" y="48" fill="#d29922" font-family="sans-serif" font-size="12" font-weight="bold">3. Python Runtime</text>
  <text x="460" y="70" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Executes Python func</text>
  <text x="460" y="90" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Calls live Yahoo API</text>
  <rect x="460" y="105" width="145" height="50" rx="4" fill="#21262d" />
  <text x="468" y="125" fill="#3fb950" font-family="sans-serif" font-size="10">Function Return:</text>
  <text x="468" y="142" fill="#3fb950" font-family="sans-serif" font-size="9">{"price": 142.50}</text>
  <text x="460" y="185" fill="#58a6ff" font-family="sans-serif" font-size="10">Sends response back</text>

  <path d="M 615 130 L 645 130" stroke="#238636" stroke-width="2" />

  <rect x="650" y="20" width="135" height="200" rx="8" fill="#1f2d23" stroke="#238636" stroke-width="1.5" />
  <text x="660" y="48" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold">4. Final Answer</text>
  <text x="660" y="70" fill="#c9d1d9" font-family="sans-serif" font-size="9">Gemini receives data</text>
  <rect x="658" y="85" width="120" height="95" rx="4" fill="#21262d" />
  <text x="664" y="105" fill="#f0f6fc" font-family="sans-serif" font-size="9">"Nvidia is trading</text>
  <text x="664" y="120" fill="#f0f6fc" font-family="sans-serif" font-size="9">at $142.50 today."</text>
  <text x="660" y="205" fill="#3fb950" font-family="sans-serif" font-size="10">🏆 Verified Fact</text>
</svg>