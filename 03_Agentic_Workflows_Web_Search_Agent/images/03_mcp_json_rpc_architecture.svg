<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="100%">
  <rect width="800" height="230" fill="#0d1117" rx="8" />

  <!-- Host App -->
  <rect x="20" y="20" width="220" height="190" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
  <text x="35" y="48" fill="#58a6ff" font-family="sans-serif" font-size="13" font-weight="bold">📱 AI Host Application</text>
  <text x="35" y="70" fill="#8b949e" font-family="sans-serif" font-size="10">(Gemini Agent / Python App)</text>
  <rect x="35" y="85" width="190" height="105" rx="4" fill="#21262d" />
  <text x="45" y="110" fill="#c9d1d9" font-family="sans-serif" font-size="10">• MCP Client Manager</text>
  <text x="45" y="130" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Dynamic tool discovery</text>
  <text x="45" y="150" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Security &amp; Auth tokens</text>
  <text x="45" y="172" fill="#3fb950" font-family="sans-serif" font-size="10">Standard JSON-RPC (stdio/SSE)</text>

  <!-- Flow Lines -->
  <path d="M 240 70 L 290 50" stroke="#3fb950" stroke-width="2" />
  <path d="M 240 115 L 290 115" stroke="#388bfd" stroke-width="2" />
  <path d="M 240 160 L 290 180" stroke="#d29922" stroke-width="2" />

  <!-- MCP Servers -->
  <rect x="300" y="25" width="480" height="50" rx="6" fill="#1f2d23" stroke="#238636" />
  <text x="315" y="48" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold">🔌 Postgres MCP Server</text>
  <text x="315" y="65" fill="#8b949e" font-family="sans-serif" font-size="10">Exposes: `query_database()`, `describe_table()`</text>

  <rect x="300" y="90" width="480" height="50" rx="6" fill="#1b2a4a" stroke="#388bfd" />
  <text x="315" y="113" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">🔌 GitHub MCP Server</text>
  <text x="315" y="130" fill="#8b949e" font-family="sans-serif" font-size="10">Exposes: `create_pull_request()`, `search_code()`</text>

  <rect x="300" y="155" width="480" height="50" rx="6" fill="#382915" stroke="#d29922" />
  <text x="315" y="178" fill="#d29922" font-family="sans-serif" font-size="12" font-weight="bold">🔌 Google Cloud Shell MCP Server</text>
  <text x="315" y="195" fill="#8b949e" font-family="sans-serif" font-size="10">Exposes: `gcloud_run_deploy()`, `view_logs()`</text>
</svg>