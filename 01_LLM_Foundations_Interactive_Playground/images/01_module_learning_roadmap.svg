<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="850" height="480" fill="#0d1117" rx="10" />

  <!-- Step 1 -->
  <rect x="25" y="20" width="800" height="95" rx="8" fill="#161b22" stroke="#238636" stroke-width="2" />
  <text x="45" y="45" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold">STEP 1: TEXT ENCODING & TOKENIZATION (BPE)</text>
  
  <rect x="45" y="55" width="220" height="45" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="60" y="75" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="bold">Raw Prompt String</text>
  <text x="60" y="90" fill="#8b949e" font-family="sans-serif" font-size="11">"The future of AI is..."</text>

  <path d="M 265 77 L 310 77" stroke="#3fb950" stroke-width="2" />

  <rect x="315" y="55" width="230" height="45" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="330" y="75" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="bold">Byte-Pair Encoding (BPE)</text>
  <text x="330" y="90" fill="#8b949e" font-family="sans-serif" font-size="11">Subword vocabulary lookup</text>

  <path d="M 545 77 L 590 77" stroke="#3fb950" stroke-width="2" />

  <rect x="595" y="55" width="210" height="45" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="610" y="75" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="bold">Discrete Token IDs</text>
  <text x="610" y="90" fill="#3fb950" font-family="sans-serif" font-size="11">[1542, 3819, 374, 189]</text>

  <!-- Step 2 -->
  <rect x="25" y="130" width="800" height="150" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2" />
  <text x="45" y="155" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold">STEP 2: TRANSFORMER DECODER CORE & ATTENTION (KV-CACHE)</text>

  <rect x="45" y="170" width="220" height="95" rx="6" fill="#21262d" stroke="#58a6ff" />
  <text x="55" y="195" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">Embedding + RoPE</text>
  <text x="55" y="215" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Rotary position clocks</text>
  <text x="55" y="235" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Relative distance preservation</text>
  <text x="55" y="255" fill="#8b949e" font-family="sans-serif" font-size="11">• 2M+ Context Window</text>

  <path d="M 265 217 L 310 217" stroke="#58a6ff" stroke-width="2" />

  <rect x="315" y="170" width="230" height="95" rx="6" fill="#21262d" stroke="#58a6ff" />
  <text x="325" y="195" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">Grouped-Query Attention</text>
  <text x="325" y="215" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Queries find matching Keys</text>
  <text x="325" y="235" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Values pass meaning forward</text>
  <text x="325" y="255" fill="#3fb950" font-family="sans-serif" font-size="11">⚡ KV-Cache: O(1) Decoding</text>

  <path d="M 545 217 L 590 217" stroke="#58a6ff" stroke-width="2" />

  <rect x="595" y="170" width="210" height="95" rx="6" fill="#21262d" stroke="#58a6ff" />
  <text x="605" y="195" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">FeedForward / MoE</text>
  <text x="605" y="215" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Deep world knowledge</text>
  <text x="605" y="235" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Top-k sparse expert routing</text>
  <text x="605" y="255" fill="#8b949e" font-family="sans-serif" font-size="11">• 30-80 Neural Layers</text>

  <!-- Step 3 -->
  <rect x="25" y="295" width="800" height="165" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2" />
  <text x="45" y="320" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold">STEP 3: SAMPLING DIALS & AUTOREGRESSIVE TOKEN GENERATION</text>

  <rect x="45" y="335" width="220" height="110" rx="6" fill="#21262d" stroke="#d29922" />
  <text x="55" y="360" fill="#d29922" font-family="sans-serif" font-size="12" font-weight="bold">Vocabulary Logits</text>
  <text x="55" y="380" fill="#c9d1d9" font-family="sans-serif" font-size="11">• "autonomous" (82%)</text>
  <text x="55" y="398" fill="#c9d1d9" font-family="sans-serif" font-size="11">• "collaborative" (12%)</text>
  <text x="55" y="416" fill="#c9d1d9" font-family="sans-serif" font-size="11">• "bright" (5%)</text>
  <text x="55" y="434" fill="#8b949e" font-family="sans-serif" font-size="11">• "banana" (0.001%)</text>

  <path d="M 265 390 L 310 390" stroke="#d29922" stroke-width="2" />

  <rect x="315" y="335" width="230" height="110" rx="6" fill="#21262d" stroke="#d29922" />
  <text x="325" y="360" fill="#d29922" font-family="sans-serif" font-size="12" font-weight="bold">Sampling Knobs</text>
  <text x="325" y="380" fill="#3fb950" font-family="sans-serif" font-size="11">🎛️ Temp = 0.0 (Factual / JSON)</text>
  <text x="325" y="398" fill="#58a6ff" font-family="sans-serif" font-size="11">🎛️ Temp = 0.7 (Balanced Writing)</text>
  <text x="325" y="416" fill="#d29922" font-family="sans-serif" font-size="11">🎯 Top-p = 0.95 (Nucleus cutoff)</text>
  <text x="325" y="434" fill="#bc8cff" font-family="sans-serif" font-size="11">🎯 Top-k = 40 (Candidate pool)</text>

  <path d="M 545 390 L 590 390" stroke="#d29922" stroke-width="2" />

  <rect x="595" y="335" width="210" height="110" rx="6" fill="#1f2d23" stroke="#238636" />
  <text x="605" y="360" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold">Winning Output Token</text>
  <text x="605" y="385" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="bold">"autonomous"</text>
  <text x="605" y="410" fill="#8b949e" font-family="sans-serif" font-size="11">Appends to prompt & repeats</text>
  <text x="605" y="428" fill="#3fb950" font-family="sans-serif" font-size="11">🔄 Live Token Streaming</text>
</svg>