<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <rect width="800" height="200" fill="#0d1117" rx="8" />
  
  <rect x="20" y="20" width="360" height="160" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5" />
  <text x="35" y="50" fill="#3fb950" font-family="sans-serif" font-size="13" font-weight="bold">📥 Input Tokens (Reading Context)</text>
  <text x="35" y="75" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Parallel GPU Matrix Multiplication</text>
  <text x="35" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Processes 5,000 words in a single pass</text>
  <text x="35" y="115" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Highly cost-efficient compute</text>
  <text x="35" y="145" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold">💵 Rate: $0.075 to $1.25 per 1M</text>

  <rect x="420" y="20" width="360" height="160" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" />
  <text x="435" y="50" fill="#ff7b72" font-family="sans-serif" font-size="13" font-weight="bold">📤 Output Tokens (Generating Words)</text>
  <text x="435" y="75" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Sequential Autoregressive Decoding</text>
  <text x="435" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="11">• 500 words = 500 separate GPU cycles</text>
  <text x="435" y="115" fill="#c9d1d9" font-family="sans-serif" font-size="11">• 4x more expensive than reading!</text>
  <text x="435" y="145" fill="#ff7b72" font-family="sans-serif" font-size="12" font-weight="bold">💵 Rate: $0.30 to $5.00 per 1M</text>
</svg>