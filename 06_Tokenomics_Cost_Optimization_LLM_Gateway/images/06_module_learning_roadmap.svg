  <rect x="305" y="445" width="245" height="70" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="320" y="470" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="bold">💵 Real-Time Cost Tracker</text>
  <text x="320" y="490" fill="#8b949e" font-family="sans-serif" font-size="11">Request Cost: $0.000184</text>
  <text x="320" y="505" fill="#58a6ff" font-family="sans-serif" font-size="11">Savings vs Pro: 88.4% Saved</text>

