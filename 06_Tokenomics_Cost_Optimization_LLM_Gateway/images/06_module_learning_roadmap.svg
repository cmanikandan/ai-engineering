  <text x="590" y="470" fill="#f0f6fc" font-family="sans-serif" font-size="12" font-weight="bold">⚡ Latency &amp; SLA Guard</text>
  <text x="590" y="490" fill="#8b949e" font-family="sans-serif" font-size="11">TTFT: 140ms | Total: 420ms</text>
  <text x="590" y="505" fill="#bc8cff" font-family="sans-serif" font-size="11">Fallback Trigger: 0 (Healthy)</text>
