  <text x="60" y="315" fill="#c9d1d9" font-family="sans-serif" font-size="11">• SLA Latency Targets</text>
  <text x="60" y="335" fill="#c9d1d9" font-family="sans-serif" font-size="11">• Fallback Cascading</text>

