<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="100%">
  <rect width="800" height="230" fill="#0d1117" rx="8" />

  <!-- Without Caching -->
  <rect x="20" y="20" width="360" height="190" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" />
  <text x="35" y="48" fill="#ff7b72" font-family="sans-serif" font-size="13" font-weight="bold">❌ Standard Requests (No Caching)</text>
  <rect x="35" y="60" width="330" height="35" rx="4" fill="#21262d" />
  <text x="45" y="82" fill="#c9d1d9" font-family="sans-serif" font-size="11">Req 1: 50,000 tokens ──► $0.0625</text>
  <rect x="35" y="102" width="330" height="35" rx="4" fill="#21262d" />
  <text x="45" y="124" fill="#c9d1d9" font-family="sans-serif" font-size="11">Req 2: 50,000 tokens ──► $0.0625</text>
  <rect x="35" y="144" width="330" height="35" rx="4" fill="#21262d" />
  <text x="45" y="166" fill="#c9d1d9" font-family="sans-serif" font-size="11">Req 3: 50,000 tokens ──► $0.0625</text>
  <text x="35" y="200" fill="#ff7b72" font-family="sans-serif" font-size="11" font-weight="bold">Total: $0.1875 (Full Price + High Latency)</text>

  <!-- With Caching -->
  <rect x="420" y="20" width="360" height="190" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5" />
  <text x="435" y="48" fill="#3fb950" font-family="sans-serif" font-size="13" font-weight="bold">✅ With Gemini Context Caching</text>
  <rect x="435" y="60" width="330" height="35" rx="4" fill="#1f2d23" />
  <text x="445" y="82" fill="#3fb950" font-family="sans-serif" font-size="11">Create Cache: 50k tokens stored in RAM</text>
  <rect x="435" y="102" width="330" height="35" rx="4" fill="#21262d" />
  <text x="445" y="124" fill="#c9d1d9" font-family="sans-serif" font-size="11">Req 1: Cache Reference ──► $0.0156 (75% off!)</text>
  <rect x="435" y="144" width="330" height="35" rx="4" fill="#21262d" />
  <text x="445" y="166" fill="#c9d1d9" font-family="sans-serif" font-size="11">Req 2: Cache Reference ──► $0.0156 (75% off!)</text>
  <text x="435" y="200" fill="#3fb950" font-family="sans-serif" font-size="11" font-weight="bold">Total: $0.1093 + 5x Faster TTFT!</text>
</svg>