<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0d1117" rx="8" />

  <text x="400" y="30" fill="#58a6ff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">TEST-TIME COMPUTE &amp; REASONING ACCURACY SCALING</text>

  <!-- Left: Standard Base Model -->
  <rect x="20" y="50" width="220" height="160" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5" />
  <text x="35" y="78" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold">1. Standard Model (System 1)</text>
  <text x="35" y="100" fill="#8b949e" font-family="sans-serif" font-size="10">• Instant token generation (10ms)</text>
  <text x="35" y="120" fill="#8b949e" font-family="sans-serif" font-size="10">• Zero internal scratchpad</text>
  <text x="35" y="140" fill="#f85149" font-family="sans-serif" font-size="10">• High error rate on multi-step math</text>
  <text x="35" y="180" fill="#8b949e" font-family="sans-serif" font-size="10">Accuracy: 45% on Hard Math</text>

  <!-- Middle: Thinking Model -->
  <rect x="280" y="50" width="240" height="160" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2" />
  <text x="295" y="78" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">2. Gemini Thinking (System 2)</text>
  <text x="295" y="100" fill="#c9d1d9" font-family="sans-serif" font-size="10">• 1,000 to 10,000 thinking tokens</text>
  <text x="295" y="120" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Explores alternative logic branches</text>
  <text x="295" y="140" fill="#3fb950" font-family="sans-serif" font-size="10">• Detects and corrects its own mistakes</text>
  <text x="295" y="180" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="bold">Accuracy: 85% on Olympiad Math</text>

  <!-- Right: Best-of-N + Tree of Thoughts -->
  <rect x="560" y="50" width="220" height="160" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5" />
  <text x="575" y="78" fill="#bc8cff" font-family="sans-serif" font-size="12" font-weight="bold">3. Tree-of-Thoughts / Best-of-N</text>
  <text x="575" y="100" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Samples N parallel reasoning paths</text>
  <text x="575" y="120" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Automated verifier ranks candidate solutions</text>
  <text x="575" y="140" fill="#bc8cff" font-family="sans-serif" font-size="10">• Deep search across theorem spaces</text>
  <text x="575" y="180" fill="#bc8cff" font-family="sans-serif" font-size="10" font-weight="bold">Accuracy: 95%+ SOTA</text>
</svg>