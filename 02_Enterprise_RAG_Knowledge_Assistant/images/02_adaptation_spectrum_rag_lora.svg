<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="100%" height="100%">
  <rect width="820" height="200" fill="#0d1117" rx="8" />

  <rect x="20" y="20" width="240" height="160" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5" />
  <text x="35" y="48" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold">1. Prompt Engineering</text>
  <text x="35" y="70" fill="#8b949e" font-family="sans-serif" font-size="10">"Tell the model in context"</text>
  <text x="35" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Few-shot examples &amp; role</text>
  <text x="35" y="115" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Instant to build (minutes)</text>
  <text x="35" y="135" fill="#8b949e" font-family="sans-serif" font-size="10">• Limited by context window</text>
  <text x="35" y="160" fill="#3fb950" font-family="sans-serif" font-size="10">Cost: Ultra-Low</text>

  <rect x="290" y="20" width="240" height="160" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2" />
  <rect x="300" y="28" width="115" height="18" rx="4" fill="#1f6feb" />
  <text x="357" y="41" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BEST FOR ENTERPRISE</text>
  <text x="305" y="65" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">2. RAG (Retrieval-Augmented)</text>
  <text x="305" y="85" fill="#8b949e" font-family="sans-serif" font-size="10">"Open-book exam for AI"</text>
  <text x="305" y="105" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Dynamic private knowledge base</text>
  <text x="305" y="125" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Real-time updates without retraining</text>
  <text x="305" y="145" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Verifiable citations &amp; zero hallucinations</text>
  <text x="305" y="165" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="bold">Speed: Immediate Data Updates</text>

  <rect x="560" y="20" width="240" height="160" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5" />
  <text x="575" y="48" fill="#bc8cff" font-family="sans-serif" font-size="12" font-weight="bold">3. Fine-Tuning / LoRA</text>
  <text x="575" y="70" fill="#8b949e" font-family="sans-serif" font-size="10">"Retrain model neural weights"</text>
  <text x="575" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Teaches specialized tone / grammar</text>
  <text x="575" y="115" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Hard to update frequently</text>
  <text x="575" y="135" fill="#8b949e" font-family="sans-serif" font-size="10">• Cannot verify sources/citations</text>
  <text x="575" y="160" fill="#bc8cff" font-family="sans-serif" font-size="10">Use: Specific Formats &amp; Syntax</text>
</svg>