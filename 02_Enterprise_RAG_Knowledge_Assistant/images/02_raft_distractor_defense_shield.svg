<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <rect width="800" height="200" fill="#0d1117" rx="8" />

  <rect x="20" y="20" width="360" height="160" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5" />
  <text x="35" y="48" fill="#ff7b72" font-family="sans-serif" font-size="12" font-weight="bold">❌ Naive RAG (Gets Distracted)</text>
  <text x="35" y="70" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Accepts all retrieved chunks as true</text>
  <text x="35" y="90" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Confuses irrelevant documents with policy</text>
  <text x="35" y="110" fill="#8b949e" font-family="sans-serif" font-size="10">• Gives incorrect answers when docs conflict</text>
  <text x="35" y="145" fill="#ff7b72" font-family="sans-serif" font-size="11" font-weight="bold">Risk: Hallucinated Customer Answers</text>

  <rect x="420" y="20" width="360" height="160" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5" />
  <text x="435" y="48" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold">✅ RAFT Defense (Retrieval-Augmented Fine-Tuning / Filtering)</text>
  <text x="435" y="70" fill="#f0f6fc" font-family="sans-serif" font-size="10">• System prompt enforces strict evidence check</text>
  <text x="435" y="90" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Quotes exact passage before answering</text>
  <text x="435" y="110" fill="#f0f6fc" font-family="sans-serif" font-size="10">• If evidence is missing: "I cannot find this in policy"</text>
  <text x="435" y="145" fill="#3fb950" font-family="sans-serif" font-size="11" font-weight="bold">Result: 100% Grounded &amp; Defensible</text>
</svg>