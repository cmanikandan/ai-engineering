<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <rect width="800" height="200" fill="#0d1117" rx="8" />

  <rect x="20" y="20" width="360" height="160" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5" />
  <text x="35" y="48" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold">1. GANs (2014-2020) - "The Duel"</text>
  <text x="35" y="70" fill="#8b949e" font-family="sans-serif" font-size="10">Generator vs Discriminator</text>
  <text x="35" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="10">• One network creates fake images</text>
  <text x="35" y="115" fill="#c9d1d9" font-family="sans-serif" font-size="10">• A detective network tries to catch fakes</text>
  <text x="35" y="135" fill="#f85149" font-family="sans-serif" font-size="10">• Brittle to train ("Mode Collapse")</text>
  <text x="35" y="160" fill="#8b949e" font-family="sans-serif" font-size="10">Legacy Era</text>

  <rect x="420" y="20" width="360" height="160" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2" />
  <text x="435" y="48" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold">2. Diffusion Models (Modern) - "The Sculptor"</text>
  <text x="435" y="70" fill="#8b949e" font-family="sans-serif" font-size="10">Reverse Denoising Process (DDPM / DiT)</text>
  <text x="435" y="95" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Forward Pass: Slowly adds Gaussian noise</text>
  <text x="435" y="115" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Reverse Pass: Neural network removes noise step-by-step</text>
  <text x="435" y="135" fill="#f0f6fc" font-family="sans-serif" font-size="10">• Stable training &amp; incredible 4K detail</text>
  <text x="435" y="160" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="bold">Powers Google Imagen 3 &amp; Veo</text>
</svg>