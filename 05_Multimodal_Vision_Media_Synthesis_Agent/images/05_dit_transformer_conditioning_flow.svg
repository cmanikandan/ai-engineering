<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0d1117" rx="8" />

  <text x="400" y="30" fill="#58a6ff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DIFFUSION TRANSFORMER (DiT) ARCHITECTURE</text>

  <!-- Noise Input -->
  <rect x="20" y="50" width="180" height="75" rx="6" fill="#161b22" stroke="#8b949e" />
  <text x="30" y="75" fill="#c9d1d9" font-family="sans-serif" font-size="11" font-weight="bold">1. Latent Image Noise</text>
  <text x="30" y="95" fill="#8b949e" font-family="sans-serif" font-size="9">Sliced into Visual Patches</text>
  <text x="30" y="112" fill="#58a6ff" font-family="sans-serif" font-size="9">Visual Token Stream</text>

  <!-- Text Input -->
  <rect x="20" y="140" width="180" height="75" rx="6" fill="#161b22" stroke="#388bfd" />
  <text x="30" y="165" fill="#58a6ff" font-family="sans-serif" font-size="11" font-weight="bold">2. User Text Prompt</text>
  <text x="30" y="185" fill="#c9d1d9" font-family="sans-serif" font-size="9">"Cyberpunk cloud datacenter"</text>
  <text x="30" y="202" fill="#3fb950" font-family="sans-serif" font-size="9">T5 / Gemini Embedding</text>

  <!-- Flow Arrows -->
  <path d="M 200 85 L 250 115" stroke="#388bfd" stroke-width="2" />
  <path d="M 200 175 L 250 145" stroke="#388bfd" stroke-width="2" />

  <!-- DiT Transformer Core -->
  <rect x="255" y="50" width="310" height="165" rx="8" fill="#1b2a4a" stroke="#388bfd" stroke-width="2" />
  <text x="270" y="78" fill="#58a6ff" font-family="sans-serif" font-size="12" font-weight="bold">Diffusion Transformer (DiT Core)</text>
  <text x="270" y="100" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Cross-Attention aligns text words to visual pixels</text>
  <text x="270" y="120" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Self-Attention models global lighting &amp; textures</text>
  <text x="270" y="140" fill="#c9d1d9" font-family="sans-serif" font-size="10">• Predicts &amp; subtracts noise at step $t$</text>
  <text x="270" y="170" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="bold">⚡ Highly Scalable TPU Distributed Compute</text>
  <text x="270" y="195" fill="#8b949e" font-family="sans-serif" font-size="9">50 Denoising Steps</text>

  <!-- Output Arrow -->
  <path d="M 565 130 L 610 130" stroke="#238636" stroke-width="2" />

  <!-- Final Clean Image -->
  <rect x="615" y="50" width="165" height="165" rx="8" fill="#1f2d23" stroke="#238636" stroke-width="1.5" />
  <text x="625" y="78" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold">3. Clean 4K Image</text>
  <rect x="625" y="95" width="145" height="85" rx="4" fill="#21262d" />
  <text x="635" y="120" fill="#f0f6fc" font-family="sans-serif" font-size="9">Photorealistic Asset</text>
  <text x="635" y="140" fill="#3fb950" font-family="sans-serif" font-size="9">Flawless Lighting</text>
  <text x="635" y="160" fill="#8b949e" font-family="sans-serif" font-size="9">PNG / WebP Export</text>
  <text x="625" y="200" fill="#3fb950" font-family="sans-serif" font-size="9" font-weight="bold">🏆 Nano Banana Pro</text>
</svg>